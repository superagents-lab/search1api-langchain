[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "search1api-langchain"
version = "0.1.0"
description = "Official Search1API tools for LangChain"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Search1API" }]
dependencies = [
  "langchain-core>=1.0,<2",
  "search1api>=0.4,<1",
]
keywords = ["search1api", "langchain", "agents", "search", "crawl", "news"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "mypy>=1.14,<2",
  "pytest>=8,<9",
  "ruff>=0.9,<1",
]

[project.urls]
Documentation = "https://s1.dev/docs"
Repository = "https://github.com/superagents-lab/search1api-langchain"
Issues = "https://github.com/superagents-lab/search1api-langchain/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
search1api_langchain = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.10"
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_ignores = true

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
